<div class="card">
  <dhx-demo-toolbar title="Calendars">
    <button (click)="getWorktime()">get Worktime</button>
  </dhx-demo-toolbar>
  <div class="gantt-host">
    <dhx-gantt style="height:600px" [tasks]="tasks" [links]="links" [config]="config"

    </dhx-gantt>
  </div>
</div>
